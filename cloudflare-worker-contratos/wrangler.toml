name = "camote-contratos"
main = "worker.js"
compatibility_date = "2026-09-11"

[vars]
ALLOWED_ORIGIN = "https://camoteweddings.com"

# Crear el KV con:  npx wrangler kv namespace create CONTRATOS
# y pegar aquí el id que devuelve:
[[kv_namespaces]]
binding = "CONTRATOS"
id = "a803d4a05aad4fab9f82c18ac941df15"

# La clave de administrador NO va en este archivo. Se configura con:
#   npx wrangler secret put ADMIN_KEY
preview_urls = false
