<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrato Sesión de Navidad | Camote Weddings</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --night:#1B120C; --maroon:#7A2020; --gold:#C9A24B; --cream:#FAF8F3; --line:#E3DDCE; --ink:#4A4F4B; --muted:#6B7068; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans',system-ui,sans-serif; line-height:1.55; }
  header { background:var(--night); color:var(--cream); padding:22px 24px; text-align:center; }
  header span { font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:1.15rem; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-family:'Playfair Display',Georgia,serif; color:var(--night); font-size:clamp(24px,5vw,34px); margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  fieldset { border:1px solid var(--line); background:#fff; border-radius:8px; padding:20px; margin:0 0 22px; }
  legend { font-family:'Playfair Display',Georgia,serif; font-weight:700; color:var(--maroon); padding:0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--night); }
  input, select { font:inherit; font-weight:400; padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:var(--cream); color:var(--night); }
  input:focus, select:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  .summary { margin-top:14px; font-size:14px; background:var(--cream); border-left:3px solid var(--gold); padding:10px 14px; border-radius:4px; }
  .terms { max-height:340px; overflow:auto; font-size:14px; padding-right:8px; }
  .terms h3 { margin:14px 0 4px; font-size:14px; color:var(--night); }
  .terms p { margin:0 0 8px; }
  .sig-wrap { border:1.5px dashed var(--gold); border-radius:8px; background:#fff; position:relative; touch-action:none; }
  canvas { width:100%; height:180px; display:block; cursor:crosshair; touch-action:none; }
  .sig-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#b9b3a3; pointer-events:none; font-size:14px; }
  .sig-actions { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:13px; }
  .linkbtn { background:none; border:none; color:var(--maroon); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .check { flex-direction:row; align-items:flex-start; gap:10px; font-weight:400; font-size:14px; margin-top:14px; }
  .check input { margin-top:4px; }
  .btn { width:100%; background:var(--gold); color:var(--night); border:none; border-radius:6px; padding:15px; font:inherit; font-weight:700; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; }
  .btn.off { background:#d8d2c2; color:#8a8577; cursor:not-allowed; }
  .msg { margin-top:12px; font-size:13px; color:var(--maroon); min-height:20px; text-align:center; }
  .ok { color:#2d6a3e; }
  label:has(input[required])::after { content:'* obligatorio'; font-size:11px; font-weight:400; color:var(--maroon); order:3; }
  input.err { border-color:var(--maroon); background:#fdf1f1; }

  /* Navidad */
  header { position:relative; overflow:hidden; padding:34px 24px 26px; background:radial-gradient(ellipse at 50% 0%, #3a2418 0%, var(--night) 70%); }
  header img { height:54px; width:auto; display:block; margin:0 auto; filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(228,201,137,.45)); position:relative; z-index:2; }
  .tag { position:relative; z-index:2; margin-top:10px; font-family:'Playfair Display',Georgia,serif; font-style:italic; color:#E4C989; font-size:14px; }
  .lights { position:absolute; top:0; left:0; right:0; height:30px; display:flex; justify-content:space-around; z-index:1; pointer-events:none; }
  .lights::before { content:""; position:absolute; left:-2%; right:-2%; top:6px; height:14px; border-bottom:2px solid #5b4a38; border-radius:0 0 50% 50% / 0 0 100% 100%; }
  .lights i { position:relative; top:13px; width:9px; height:13px; border-radius:50% 50% 50% 50% / 40% 40% 60% 60%; background:var(--c); box-shadow:0 0 10px 3px var(--c); animation:tw 2.4s ease-in-out infinite; animation-delay:var(--d); }
  .lights i:nth-child(even) { top:18px; }
  @keyframes tw { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .star { position:absolute; z-index:1; pointer-events:none; animation:sp 3s ease-in-out infinite; }
  .star svg { width:100%; height:100%; display:block; filter:drop-shadow(0 0 6px rgba(228,201,137,.7)); }
  @keyframes sp { 0%,100% { transform:scale(1) rotate(0); opacity:.9; } 50% { transform:scale(.7) rotate(15deg); opacity:.5; } }
  .snow { position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden; }
  .snow b { position:absolute; top:-12px; width:var(--s); height:var(--s); border-radius:50%; background:#fff; opacity:.75; box-shadow:0 0 6px rgba(255,255,255,.9); animation:fall linear infinite; }
  @keyframes fall { to { transform:translate3d(var(--x),105vh,0); } }
  fieldset { border-color:#d9c48f; box-shadow:0 4px 14px rgba(122,32,32,.06); }
  legend::before { content:"✦ "; color:var(--gold); }
  legend::after { content:" ✦"; color:var(--gold); }
  .garland { height:10px; margin:0 0 26px; background:repeating-linear-gradient(90deg,#7A2020 0 18px,#C9A24B 18px 36px,#1B3A2F 36px 54px); opacity:.9; border-radius:4px; }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:0 20px 40px; }
  footer span { color:var(--gold); letter-spacing:6px; }
  @media (prefers-reduced-motion: reduce) { .snow, .lights i, .star { animation:none; } .snow { display:none; } }
</style>
</head>
<body>
<header>
  <div class="lights"><i style="--c:#ff4d4d;--d:0.00s"></i><i style="--c:#ffd45e;--d:0.45s"></i><i style="--c:#4dd68c;--d:0.90s"></i><i style="--c:#ffffff;--d:1.35s"></i><i style="--c:#ff4d4d;--d:1.80s"></i><i style="--c:#ffd45e;--d:0.00s"></i><i style="--c:#4dd68c;--d:0.45s"></i><i style="--c:#ffffff;--d:0.90s"></i><i style="--c:#ff4d4d;--d:1.35s"></i><i style="--c:#ffd45e;--d:1.80s"></i><i style="--c:#4dd68c;--d:0.00s"></i><i style="--c:#ffffff;--d:0.45s"></i><i style="--c:#ff4d4d;--d:0.90s"></i><i style="--c:#ffd45e;--d:1.35s"></i></div>
  <div class="star" style="top:44px;left:7%;width:18px;height:18px;animation-delay:0s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:70px;left:20%;width:12px;height:12px;animation-delay:0.8s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:48px;right:8%;width:20px;height:20px;animation-delay:0.4s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:78px;right:22%;width:13px;height:13px;animation-delay:1.3s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:60px;left:42%;width:10px;height:10px;animation-delay:1.8s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:90px;right:42%;width:11px;height:11px;animation-delay:0.2s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div>
  <a href="/"><img src="https://res.cloudinary.com/rauzqcoj/image/upload/f_auto,q_auto,w_400/LOGO_CAMOTE-06" alt="Camote Weddings"></a>
  <div class="tag">Sesiones de Navidad en estudio</div>
</header>
<main>
  <div class="garland"></div>
  <h1>🎄 Contrato de Sesión de Navidad</h1>
  <p class="sub">Completa tus datos, lee el contrato, firma con el dedo o el mouse y descarga tu copia en PDF.</p>

  <form id="f" autocomplete="off" novalidate>
    <fieldset>
      <legend>Datos del cliente</legend>
      <div class="grid">
        <label>Nombre completo<input id="nombre" required></label>
        <label>Carnet de identidad (CI)<input id="ci" required></label>
        <label>Teléfono / WhatsApp<input id="tel" inputmode="tel" required></label>
        <label>Correo electrónico<input id="email" type="email" required></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Paquete y sesión</legend>
      <div class="grid">
        <label>Paquete
          <select id="paquete">
            <option value="Mini Sesión|250|30 minutos de sesión + 8 fotos digitales editadas + galería en línea">Mini Sesión — Bs.250</option>
            <option value="Sesión Extendida|500|45 minutos de sesión + 15 fotos digitales editadas + 15 fotos impresas 10x15 + galería en línea">Sesión Extendida — Bs.500</option>
          </select>
        </label>
        <label>Fecha de la sesión<input id="fecha" type="date" required></label>
        <label>Hora<input id="hora" type="time" required></label>
      </div>
      <div class="summary" id="resumen"></div>
    </fieldset>

    <fieldset>
      <legend>Términos del contrato</legend>
      <div class="terms" id="terms"></div>
      <label class="check"><input type="checkbox" id="acepto"> He leído y acepto los términos del contrato.</label>
    </fieldset>

    <fieldset>
      <legend>Firma del cliente</legend>
      <div class="sig-wrap">
        <canvas id="sig"></canvas>
        <div class="sig-hint" id="hint">Firma aquí</div>
      </div>
      <div class="sig-actions">
        <span id="sigstate" style="color:var(--muted)">Sin firma</span>
        <button type="button" class="linkbtn" id="clear">Borrar firma</button>
      </div>
    </fieldset>

    <button class="btn off" id="go" type="submit">Firmar y descargar PDF</button>
    <div class="msg" id="msg"></div>
  </form>
</main>
<footer><span>✦ ✦ ✦</span><br>¡Felices fiestas! — Camote Weddings</footer>
<div class="snow" id="snow"></div>

<script>
(function () {
  var sn = $s();
  function $s() { return document.getElementById("snow"); }
  for (var i = 0; i < 28; i++) {
    var b = document.createElement("b");
    b.style.cssText = "left:" + (Math.random() * 100) + "%;--s:" + (2 + Math.random() * 4).toFixed(1) + "px;--x:" + ((Math.random() * 80) - 40).toFixed(0) + "px;animation-duration:" + (9 + Math.random() * 12).toFixed(1) + "s;animation-delay:-" + (Math.random() * 20).toFixed(1) + "s";
    sn.appendChild(b);
  }
  var STUDIO = "Camote Weddings";
  var $ = function (id) { return document.getElementById(id); };

  var CLAUSULAS = [
    ["1. Objeto", "Camote Weddings (el «Estudio») prestará al cliente el servicio de sesión fotográfica de Navidad en estudio, según el paquete, fecha y hora indicados en este contrato."],
    ["2. Contenido del paquete", "El paquete contratado incluye lo descrito en el resumen anterior. Cualquier extra (impresiones adicionales, ampliaciones en MDF) se cotiza y acuerda por separado."],
    ["3. Precio y forma de pago", "El valor del paquete es el indicado. La fecha se aparta con el 70% del valor del paquete; el 30% restante se paga el día de la sesión."],
    ["4. Entrega", "El Estudio entregará las fotos digitales editadas mediante galería en línea y las fotos impresas (si el paquete las incluye) en una fecha coordinada a tiempo para la Navidad, según la fecha de la sesión."],
    ["5. Puntualidad", "La sesión se realiza en el horario reservado. El retraso del cliente reduce el tiempo de sesión sin extender el horario ni modificar el precio."],
    ["6. Reprogramación", "El cliente puede solicitar el cambio de fecha con anticipación, sujeto a disponibilidad de cupos del Estudio."],
    ["7. Uso de imágenes", "Las fotografías son obra del Estudio, que cede al cliente su uso personal. El cliente autoriza al Estudio a usar las imágenes con fines de portafolio y promoción, salvo que lo indique expresamente por escrito."],
    ["8. Aceptación", "Ambas partes aceptan este contrato con la firma del cliente. El presente documento se genera en formato digital y tiene validez como constancia de aceptación."]
  ];

  // Términos en pantalla
  $("terms").innerHTML = CLAUSULAS.map(function (c) {
    return "<h3>" + c[0] + "</h3><p>" + c[1] + "</p>";
  }).join("");

  function pkg() {
    var p = $("paquete").value.split("|");
    var precio = Number(p[1]);
    return { nombre: p[0], precio: precio, anticipo: precio * 0.7, resto: precio * 0.3, incluye: p[2] };
  }
  function bs(n) { return "Bs." + (Math.round(n * 100) / 100).toString().replace(/\.0+$/, ""); }
  function fmtFecha(v) {
    if (!v) return "";
    var d = v.split("-");
    return d[2] + "/" + d[1] + "/" + d[0];
  }
  function resumen() {
    var p = pkg();
    $("resumen").innerHTML = "<strong>" + p.nombre + "</strong> — " + bs(p.precio) + "<br>" + p.incluye +
      "<br>Reserva (70%): <strong>" + bs(p.anticipo) + "</strong> · Día de la sesión (30%): <strong>" + bs(p.resto) + "</strong>";
  }
  $("paquete").addEventListener("change", resumen);
  resumen();

  // Firma
  var cv = $("sig"), ctx, signed = false, drawing = false;
  function setup() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    var keep = signed ? cv.toDataURL() : null;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1B120C";
    if (keep) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = keep; }
  }
  function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener("pointerdown", function (e) {
    drawing = true; cv.setPointerCapture(e.pointerId);
    var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
    mark();
  });
  cv.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) {
    cv.addEventListener(t, function () { drawing = false; });
  });
  function mark() {
    if (!signed) { signed = true; $("hint").style.display = "none"; $("sigstate").textContent = "Firma registrada"; validar(); }
  }
  $("clear").addEventListener("click", function () {
    ctx.clearRect(0, 0, cv.width, cv.height);
    signed = false; $("hint").style.display = ""; $("sigstate").textContent = "Sin firma"; validar();
  });
  window.addEventListener("resize", setup);
  setup();

  // Validación: el PDF solo se habilita con firma + datos + aceptación
  function validar() {
    var ok = signed && $("acepto").checked &&
      ["nombre", "ci", "tel", "email", "fecha", "hora"].every(function (id) { return $(id).value.trim() && $(id).checkValidity(); });
    $("go").classList.toggle("off", !ok);
    return ok;
  }
  ["nombre", "ci", "tel", "email", "fecha", "hora", "acepto"].forEach(function (id) {
    $(id).addEventListener("input", function () { $(id).classList.remove("err"); });
    $(id).addEventListener("input", validar);
    $(id).addEventListener("change", validar);
  });

  var FIRMA_ESTUDIO = "firma-victor.png";
  function cargarFirmaEstudio() {
    return new Promise(function (res) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext("2d").drawImage(im, 0, 0);
        res({ data: c.toDataURL("image/png"), w: c.width, h: c.height });
      };
      im.onerror = function () { res(null); };
      im.src = FIRMA_ESTUDIO + "?v=" + Date.now();
    });
  }

  var LOGO_URL = "https://res.cloudinary.com/rauzqcoj/image/upload/f_auto,q_auto,w_400/LOGO_CAMOTE-06";
  function cargarLogo() {
    return new Promise(function (res) {
      var im = new Image(); im.crossOrigin = "anonymous";
      im.onload = function () {
        try {
          var c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
          var x = c.getContext("2d"); x.drawImage(im, 0, 0);
          var d = x.getImageData(0, 0, c.width, c.height), a = d.data;
          for (var i = 0; i < a.length; i += 4) { a[i] = 255; a[i + 1] = 255; a[i + 2] = 255; }
          x.putImageData(d, 0, 0);
          res({ data: c.toDataURL("image/png"), w: c.width, h: c.height });
        } catch (e) { res(null); }
      };
      im.onerror = function () { res(null); };
      im.src = LOGO_URL;
    });
  }

  function generarPDF(firmaEst, logo) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: "mm", format: "a4" });
    var W = 210, M = 20, CW = W - 2 * M, y = 0;
    var p = pkg();
    var ahora = new Date();
    var fechaFirma = ahora.toLocaleDateString("es-BO", { day: "2-digit", month: "long", year: "numeric" });

    function need(h) { if (y + h > 280) { doc.addPage(); y = 22; } }
    function para(txt, size, style, gap) {
      doc.setFont("helvetica", style || "normal"); doc.setFontSize(size || 10.5);
      var lines = doc.splitTextToSize(txt, CW);
      lines.forEach(function (l) { need(6); doc.text(l, M, y); y += (size || 10.5) * 0.46; });
      y += gap == null ? 2.5 : gap;
    }

    // Encabezado
    doc.setFillColor(27, 18, 12); doc.rect(0, 0, W, 26, "F");
    doc.setTextColor(250, 248, 243); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    if (logo) { var lh = 14, lw = lh * (logo.w / logo.h); doc.addImage(logo.data, "PNG", M, 6, lw, lh); }
    else doc.text(STUDIO, M, 16);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text("camoteweddings.com", W - M, 16, { align: "right" });
    doc.setTextColor(27, 18, 12);
    y = 40;
    doc.setFont("helvetica", "bold"); doc.setFontSize(15);
    doc.text("CONTRATO DE SESIÓN FOTOGRÁFICA DE NAVIDAD", M, y); y += 10;

    para("Entre " + STUDIO + " (el «Estudio») y el cliente identificado a continuación, se acuerda lo siguiente:", 10.5, "normal", 4);

    // Datos
    var filas = [
      ["Cliente", $("nombre").value.trim()],
      ["CI", $("ci").value.trim()],
      ["Teléfono", $("tel").value.trim()]
    ];
    filas.push(["Correo", $("email").value.trim()]);
    filas.push(["Paquete", p.nombre + " — " + bs(p.precio)]);
    filas.push(["Incluye", p.incluye]);
    filas.push(["Fecha y hora", fmtFecha($("fecha").value) + " a las " + $("hora").value]);
    filas.push(["Reserva (70%)", bs(p.anticipo)]);
    filas.push(["Día de la sesión (30%)", bs(p.resto)]);
    filas.forEach(function (r) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(10.5);
      var lines = doc.splitTextToSize(r[1], CW - 52);
      need(lines.length * 5 + 3);
      doc.text(r[0] + ":", M, y);
      doc.setFont("helvetica", "normal");
      doc.text(lines, M + 52, y);
      y += lines.length * 5 + 1.5;
    });
    y += 4;
    doc.setDrawColor(201, 162, 75); doc.line(M, y, W - M, y); y += 8;

    // Cláusulas
    CLAUSULAS.forEach(function (c) {
      need(18);
      para(c[0], 11, "bold", 1);
      para(c[1], 10.5, "normal", 4);
    });

    // Firmas
    need(70); y += 6;
    var img = cv.toDataURL("image/png");
    var sw = 70, sh = sw * (cv.height / cv.width);
    if (sh > 32) { sh = 32; sw = sh * (cv.width / cv.height); }
    doc.addImage(img, "PNG", M, y, sw, sh);
    if (firmaEst) {
      var ew = 70, eh = ew * (firmaEst.h / firmaEst.w);
      if (eh > 32) { eh = 32; ew = eh * (firmaEst.w / firmaEst.h); }
      doc.addImage(firmaEst.data, "PNG", W - M - 75, y, ew, eh);
    }
    var ly = y + 34;
    doc.setDrawColor(27, 18, 12); doc.line(M, ly, M + 75, ly); doc.line(W - M - 75, ly, W - M, ly);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.text($("nombre").value.trim(), M, ly + 5);
    doc.text("Victor Villarroel", W - M - 75, ly + 5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text("Cliente — CI " + $("ci").value.trim(), M, ly + 10);
    doc.text("Representante — " + STUDIO, W - M - 75, ly + 10);
    doc.setFontSize(8.5); doc.setTextColor(107, 112, 104);
    doc.text("Firmado digitalmente el " + fechaFirma + " a las " + ahora.toLocaleTimeString("es-BO", { hour: "2-digit", minute: "2-digit" }), M, ly + 20);

    var slug = $("nombre").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    doc.save("contrato-navidad-" + (slug || "cliente") + ".pdf");
  }

  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = $("msg"); m.className = "msg";
    if (!validar()) {
      var falt = false;
      ["nombre", "ci", "tel", "email", "fecha", "hora"].forEach(function (id) {
        var bad = !$(id).value.trim() || !$(id).checkValidity();
        $(id).classList.toggle("err", bad); falt = falt || bad;
      });
      m.textContent = falt ? "Completa todos los campos obligatorios marcados en rojo." : (!$("acepto").checked ? "Debes aceptar los términos del contrato." : "Falta la firma del cliente.");
      return;
    }
    if (!window.jspdf) { m.textContent = "No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo."; return; }
    Promise.all([cargarFirmaEstudio(), cargarLogo()]).then(function (r) {
      try { generarPDF(r[0], r[1]); m.className = "msg ok"; m.textContent = "Contrato firmado. Tu PDF se descargó."; }
      catch (err) { m.textContent = "Error al generar el PDF. Intenta de nuevo."; }
    });
  });
})();
</script>
</body>
</html>
