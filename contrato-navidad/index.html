<style>
  :root { --night:#1B120C; --maroon:#7A2020; --gold:#C9A24B; --cream:#FAF8F3; --line:#E3DDCE; --ink:#4A4F4B; --muted:#6B7068; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans',system-ui,sans-serif; line-height:1.55; }
  header { background:var(--night); color:var(--cream); padding:22px 24px; text-align:center; }
  header span { font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:1.15rem; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-family:'Playfair Display',Georgia,serif; color:var(--night); font-size:clamp(24px,5vw,34px); margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  fieldset { border:1px solid var(--line); background:#fff; border-radius:8px; padding:20px; margin:0 0 22px; }
  legend { font-family:'Playfair Display',Georgia,serif; font-weight:700; color:var(--maroon); padding:0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--night); }
  input, select { font:inherit; font-weight:400; padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:var(--cream); color:var(--night); }
  input:focus, select:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  .summary { margin-top:14px; font-size:14px; background:var(--cream); border-left:3px solid var(--gold); padding:10px 14px; border-radius:4px; }
  .terms { max-height:340px; overflow:auto; font-size:14px; padding-right:8px; }
  .terms h3 { margin:14px 0 4px; font-size:14px; color:var(--night); }
  .terms p { margin:0 0 8px; }
  .sig-wrap { border:1.5px dashed var(--gold); border-radius:8px; background:#fff; position:relative; touch-action:none; }
  canvas { width:100%; height:180px; display:block; cursor:crosshair; touch-action:none; }
  .sig-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#b9b3a3; pointer-events:none; font-size:14px; }
  .sig-actions { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:13px; }
  .linkbtn { background:none; border:none; color:var(--maroon); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .check { flex-direction:row; align-items:flex-start; gap:10px; font-weight:400; font-size:14px; margin-top:14px; }
  .check input { margin-top:4px; }
  .btn { width:100%; background:var(--gold); color:var(--night); border:none; border-radius:6px; padding:15px; font:inherit; font-weight:700; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; }
  .btn.off { background:#d8d2c2; color:#8a8577; cursor:not-allowed; }
  .msg { margin-top:12px; font-size:13px; color:var(--maroon); min-height:20px; text-align:center; }
  .ok { color:#2d6a3e; }
  label:has(input[required])::after { content:'* obligatorio'; font-size:11px; font-weight:400; color:var(--maroon); order:3; }
  input.err { border-color:var(--maroon); background:#fdf1f1; }

  /* Navidad */
  header { position:relative; overflow:hidden; padding:42px 20px 30px; background:radial-gradient(ellipse at 50% 0%, #3a2418 0%, var(--night) 70%); }
  header img { height:92px; max-width:80%; object-fit:contain; width:auto; display:block; margin:0 auto; filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(228,201,137,.45)); position:relative; z-index:2; }
  .tag { position:relative; z-index:2; margin-top:10px; font-family:'Playfair Display',Georgia,serif; font-style:italic; color:#E4C989; font-size:14px; }
  .lights { position:absolute; top:0; left:0; right:0; height:30px; display:flex; justify-content:space-around; z-index:1; pointer-events:none; }
  .lights::before { content:""; position:absolute; left:-2%; right:-2%; top:6px; height:14px; border-bottom:2px solid #5b4a38; border-radius:0 0 50% 50% / 0 0 100% 100%; }
  .lights i { position:relative; top:13px; width:9px; height:13px; border-radius:50% 50% 50% 50% / 40% 40% 60% 60%; background:var(--c); box-shadow:0 0 10px 3px var(--c); animation:tw 2.4s ease-in-out infinite; animation-delay:var(--d); }
  .lights i:nth-child(even) { top:18px; }
  @keyframes tw { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .star { position:absolute; z-index:1; pointer-events:none; animation:sp 3s ease-in-out infinite; }
  .star svg { width:100%; height:100%; display:block; filter:drop-shadow(0 0 6px rgba(228,201,137,.7)); }
  @keyframes sp { 0%,100% { transform:scale(1) rotate(0); opacity:.9; } 50% { transform:scale(.7) rotate(15deg); opacity:.5; } }
  fieldset { border-color:#d9c48f; box-shadow:0 4px 14px rgba(122,32,32,.06); }
  legend::before { content:"✦ "; color:var(--gold); }
  legend::after { content:" ✦"; color:var(--gold); }
  .garland { height:10px; margin:0 0 26px; background:repeating-linear-gradient(90deg,#7A2020 0 18px,#C9A24B 18px 36px,#1B3A2F 36px 54px); opacity:.9; border-radius:4px; }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:0 20px 40px; }
  footer span { color:var(--gold); letter-spacing:6px; }
  @media (prefers-reduced-motion: reduce) { .lights i, .star, .bulb { animation:none; } }
  input, select { font-size:16px; min-height:48px; width:100%; -webkit-appearance:none; appearance:none; }
  input[type=checkbox] { width:22px; min-height:22px; flex-shrink:0; -webkit-appearance:auto; appearance:auto; }
  .btn { min-height:54px; font-size:15px; }
  .linkbtn { padding:10px 4px; font-size:14px; }
  @media (max-width:560px) {
    header img { height:80px; }
    main { padding:22px 14px 48px; }
    fieldset { padding:16px 14px; }
    .terms { max-height:260px; font-size:14px; }
    canvas { height:200px; }
    .lights i:nth-child(n+11) { display:none; }
    .star:nth-of-type(n+5) { display:none; }
  }
  html { -webkit-text-size-adjust:100%; }
  body { overflow-x:hidden; padding-bottom:env(safe-area-inset-bottom); }
  body { background-color:#10261E;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(122,32,32,.45), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(201,162,75,.14), transparent 40%),
      radial-gradient(rgba(228,201,137,.16) 1.2px, transparent 1.6px),
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px),
      linear-gradient(180deg,#0E2119 0%,#143528 55%,#0B1A14 100%);
    background-size:auto,auto,46px 46px,23px 23px,auto;
    background-position:0 0,0 0,0 0,11px 11px,0 0;
    background-attachment:fixed; }
  h1 { color:#FAF8F3; text-shadow:0 2px 14px rgba(0,0,0,.4); }
  .sub { color:#cfd8cf; }
  .msg { color:#ffb4a8; }
  .msg.ok { color:#9fe3b0; }
  footer { color:#b8c4ba; }
  fieldset { background:#FFFDF8; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  legend { background:#FFFDF8; border:1px solid #d9c48f; border-radius:999px; padding:4px 14px; font-size:14px; }
  #tree { position:fixed; left:50%; bottom:-2vh; transform:translateX(-50%); width:min(96vw,640px); height:96vh; z-index:0; pointer-events:none; opacity:.42; filter:blur(2.2px); }
  #tree svg { width:100%; height:100%; display:block; }
  .bulb { animation:bulb 3.2s ease-in-out infinite; }
  @keyframes bulb { 0%,100% { opacity:.95; } 50% { opacity:.35; } }
  #snow { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }
  header, main, footer { position:relative; z-index:1; }
  /* Protección de la vista previa (disuasiva) */
  .doc { background:#FFFDF8; border-radius:10px; padding:22px 20px; box-shadow:0 8px 24px rgba(0,0,0,.35); position:relative; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; transition:filter .15s; }
  .doc.hide { filter:blur(22px); }
  .doc h2 { font-family:'Playfair Display',Georgia,serif; color:var(--night); font-size:18px; margin:0 0 12px; }
  .doc dl { margin:0 0 14px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; }
  .doc dt { font-weight:600; color:var(--night); } .doc dd { margin:0; }
  .doc h3 { margin:14px 0 4px; font-size:14px; color:var(--night); } .doc p { margin:0 0 8px; font-size:14px; }
  .wm { position:absolute; inset:0; pointer-events:none; opacity:.13; }
  .state { text-align:center; color:#FAF8F3; padding:40px 10px; }
  .done { background:#FFFDF8; border-radius:10px; padding:22px; text-align:center; color:var(--night); }
  @media print { body * { display:none !important; } body::before { content:"Documento protegido. No se permite imprimir."; display:block; color:#000; padding:40px; } }
</style>

  <div class="star" style="top:44px;left:7%;width:18px;height:18px;animation-delay:0s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:70px;left:20%;width:12px;height:12px;animation-delay:0.8s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:48px;right:8%;width:20px;height:20px;animation-delay:0.4s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:78px;right:22%;width:13px;height:13px;animation-delay:1.3s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:60px;left:42%;width:10px;height:10px;animation-delay:1.8s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div><div class="star" style="top:90px;right:42%;width:11px;height:11px;animation-delay:0.2s"><svg viewBox="0 0 100 100"><polygon points="50,4 61,37 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,37" fill="#E4C989"/></svg></div>

<script>
(function () {
  var C = window.Contrato, $ = function (id) { return document.getElementById(id); };
  var app = $("app"), id = new URLSearchParams(location.search).get("c");
  var cv, ctx, signed = false, drawing = false, data;

  function estado(msg) { app.innerHTML = '<div class="state">' + msg + "</div>"; }
  if (!C.configurado()) return estado("Servicio no configurado.");
  if (!id) return estado("Este enlace no es válido. Solicita tu enlace de contrato a Camote Weddings.");

  C.api("/c/" + encodeURIComponent(id)).then(render).catch(function (e) {
    estado(e.status === 404 ? "Este contrato no existe o el enlace ya no es válido." : "No se pudo cargar el contrato. Intenta de nuevo.");
  });

  function render(c) {
    data = c;
    var ant = c.precio * 0.7, resto = c.precio * 0.3;
    var ci = c.ci.length > 4 ? c.ci.slice(0, -4).replace(/./g, "•") + c.ci.slice(-4) : c.ci;
    var wmText = C.esc(c.nombre) + " · " + new Date().toLocaleDateString("es-BO") + " · PREVISUALIZACIÓN";
    var wm = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='170'><text x='10' y='100' transform='rotate(-24 160 85)' font-family='sans-serif' font-size='15' font-weight='700' fill='#1B120C'>" + wmText + "</text></svg>";
    var h = '<div class="doc" id="doc"><h2>CONTRATO DE SESIÓN FOTOGRÁFICA DE NAVIDAD</h2>' +
      "<p>Entre " + C.STUDIO + " (el «Estudio») y el cliente identificado a continuación, se acuerda lo siguiente:</p><dl>" +
      "<dt>Cliente</dt><dd>" + C.esc(c.nombre) + "</dd><dt>CI</dt><dd>" + C.esc(ci) + "</dd>" +
      "<dt>Teléfono</dt><dd>" + C.esc(c.tel) + "</dd><dt>Correo</dt><dd>" + C.esc(c.email) + "</dd>" +
      "<dt>Paquete</dt><dd>" + C.esc(c.paquete) + " — " + C.bs(c.precio) + "</dd><dt>Incluye</dt><dd>" + C.esc(c.incluye) + "</dd>" +
      "<dt>Fecha y hora</dt><dd>" + C.fmtFecha(c.fecha) + " a las " + C.esc(c.hora) + "</dd>" +
      "<dt>Reserva (70%)</dt><dd>" + C.bs(ant) + "</dd><dt>Día de la sesión (30%)</dt><dd>" + C.bs(resto) + "</dd></dl>" +
      C.CLAUSULAS.map(function (x) { return "<h3>" + x[0] + "</h3><p>" + x[1] + "</p>"; }).join("") +
      '<div class="wm" style="background:url(\'data:image/svg+xml;utf8,' + encodeURIComponent(wm) + '\')"></div></div>';

    if (c.firmado) {
      app.innerHTML = h + '<div class="done" style="margin-top:18px"><strong>✅ Este contrato ya fue firmado.</strong><br>Camote Weddings conserva el original.</div>';
    } else {
      app.innerHTML = '<p class="sub">Lee el contrato, acepta los términos y firma con el dedo o el mouse. Camote Weddings conservará el original firmado.</p>' + h +
        '<form id="f" style="margin-top:20px" novalidate><fieldset><legend>Confirmación</legend>' +
        '<label class="check" style="margin-top:0"><input type="checkbox" id="acepto"> He leído y acepto los términos del contrato.</label></fieldset>' +
        '<fieldset><legend>Firma del cliente</legend><div class="sig-wrap"><canvas id="sig"></canvas><div class="sig-hint" id="hint">Firma aquí</div></div>' +
        '<div class="sig-actions"><span id="sigstate" style="color:var(--muted)">Sin firma</span><button type="button" class="linkbtn" id="clear">Borrar firma</button></div></fieldset>' +
        '<button class="btn off" id="go" type="submit">Firmar contrato</button><div class="msg" id="msg"></div></form>';
      initFirma();
    }
    protect();
  }

  function initFirma() {
    cv = $("sig");
    function setup() {
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, keep = signed ? cv.toDataURL() : null;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1B120C";
      if (keep) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = keep; }
    }
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener("pointerdown", function (e) {
      drawing = true; cv.setPointerCapture(e.pointerId);
      var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
      if (!signed) { signed = true; $("hint").style.display = "none"; $("sigstate").textContent = "Firma registrada"; validar(); }
    });
    cv.addEventListener("pointermove", function (e) { if (drawing) { var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) { cv.addEventListener(t, function () { drawing = false; }); });
    $("clear").addEventListener("click", function () {
      ctx.clearRect(0, 0, cv.width, cv.height); signed = false; $("hint").style.display = ""; $("sigstate").textContent = "Sin firma"; validar();
    });
    window.addEventListener("resize", setup); setup();
    $("acepto").addEventListener("change", validar);
    $("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var m = $("msg"); m.className = "msg";
      if (!validar()) { m.textContent = !$("acepto").checked ? "Debes aceptar los términos del contrato." : "Falta la firma del cliente."; return; }
      $("go").classList.add("off"); m.textContent = "Enviando…";
      C.api("/c/" + encodeURIComponent(id) + "/sign", { method: "POST", body: { firma: cv.toDataURL("image/png") } })
        .then(function () { app.querySelector("form").outerHTML = '<div class="done" style="margin-top:18px"><strong>✅ Contrato firmado.</strong><br>Gracias, ' + C.esc(data.nombre) + '. Camote Weddings recibió tu firma.</div>'; })
        .catch(function (er) { $("go").classList.remove("off"); m.textContent = er.status === 409 ? "Este contrato ya fue firmado." : "No se pudo enviar la firma. Intenta de nuevo."; });
    });
  }
  function validar() { var ok = signed && $("acepto").checked; $("go").classList.toggle("off", !ok); return ok; }

  // Disuasión de copia/captura (no es infalible: no existe forma de bloquear capturas del sistema operativo).
  function protect() {
    var doc = $("doc"), tmr;
    function ocultar(ms) { doc.classList.add("hide"); clearTimeout(tmr); tmr = 0; if (ms) tmr = setTimeout(mostrar, ms); }
    function mostrar() { tmr = 0; if (!document.hidden) doc.classList.remove("hide"); }
    ["contextmenu", "copy", "cut", "dragstart", "selectstart"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }); });
    document.addEventListener("keydown", function (e) {
      var k = (e.key || "").toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (k === "printscreen" || (mod && ["p", "s", "c", "u"].indexOf(k) > -1) || (e.metaKey && e.shiftKey && ["3", "4", "5"].indexOf(k) > -1) || (e.ctrlKey && e.shiftKey && k === "s")) {
        e.preventDefault(); ocultar(1800);
        try { navigator.clipboard.writeText(" "); } catch (x) {}
      }
    });
    window.addEventListener("blur", function () { ocultar(0); });
    window.addEventListener("focus", mostrar);
    document.addEventListener("visibilitychange", function () { document.hidden ? ocultar(0) : mostrar(); });
    ["pointerdown", "touchstart", "scroll"].forEach(function (t) { window.addEventListener(t, function () { if (!tmr) mostrar(); }, { passive: true }); });
  }
})();

// Árbol de fondo
(function () {
  var rnd = (function (a) { return function () { a = (a * 1664525 + 1013904223) % 4294967296; return a / 4294967296; }; })(7);
  var W = 400, H = 700, cx = 200, out = "", lights = "";
  var tiers = 9, top = 70, bottom = 640;
  for (var t = 0; t < tiers; t++) {
    var y0 = top + t * ((bottom - top) / tiers) * 0.82;
    var h = 120 + t * 14, hw = 34 + t * 19;
    var pts = [[cx, y0]];
    var n = 16;
    for (var i = 1; i <= n; i++) {                       // borde derecho dentado
      var k = i / n, x = cx + hw * k + (i % 2 ? 6 : -4) + rnd() * 5, y = y0 + h * k * 0.9 + (i % 2 ? 7 : 0);
      pts.push([x, y]);
    }
    pts.push([cx + hw * 0.55, y0 + h * 1.02]);
    pts.push([cx - hw * 0.55, y0 + h * 1.02]);
    for (i = n; i >= 1; i--) {                           // borde izquierdo dentado
      k = i / n; x = cx - hw * k - (i % 2 ? 6 : -4) - rnd() * 5; y = y0 + h * k * 0.9 + (i % 2 ? 7 : 0);
      pts.push([x, y]);
    }
    var shade = 30 + t * 2;
    out += '<polygon points="' + pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") +
           '" fill="hsl(150,45%,' + (shade - 12) + '%)" stroke="hsl(145,40%,' + (shade + 6) + '%)" stroke-width="1.5"/>';
    for (var j = 0; j < 14 + t * 3; j++) {               // ramitas de aguja
      var bx = cx + (rnd() - .5) * hw * 1.7, by = y0 + h * (.15 + rnd() * .85);
      out += '<path d="M' + bx.toFixed(0) + ' ' + by.toFixed(0) + ' l' + ((rnd() - .5) * 26).toFixed(0) + ' ' + (8 + rnd() * 10).toFixed(0) +
             '" stroke="hsl(140,50%,' + (shade + 12) + '%)" stroke-width="2" stroke-linecap="round" opacity=".7"/>';
    }
    for (j = 0; j < 4 + t; j++) {                        // luces
      var lx = cx + (rnd() - .5) * hw * 1.6, ly = y0 + h * (.25 + rnd() * .7);
      var c = ["#ff5a5a", "#ffd45e", "#7dffb0", "#ffffff", "#ff9be0"][Math.floor(rnd() * 5)];
      lights += '<circle class="bulb" cx="' + lx.toFixed(0) + '" cy="' + ly.toFixed(0) + '" r="' + (3 + rnd() * 3).toFixed(1) +
                '" fill="' + c + '" style="animation-delay:' + (rnd() * 3).toFixed(1) + 's"/>' +
                '<circle cx="' + lx.toFixed(0) + '" cy="' + ly.toFixed(0) + '" r="10" fill="' + c + '" opacity=".25"/>';
    }
  }
  var star = '<polygon points="200,18 207,48 238,49 213,66 222,96 200,78 178,96 187,66 162,49 193,48" fill="#E4C989"/>' +
             '<circle cx="200" cy="58" r="26" fill="#E4C989" opacity=".25"/>';
  document.getElementById("tree").innerHTML =
    '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMax meet">' +
    '<rect x="186" y="610" width="28" height="80" fill="#3b2616"/>' + out + lights + star + "</svg>";
})();

// Nieve con física: cae natural y el scroll hacia arriba la sopla
(function () {
  var cv = document.getElementById("snow"), ctx = cv.getContext("2d");
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { cv.style.display = "none"; return; }
  var w, h, dpr, flakes = [], N = window.innerWidth < 600 ? 70 : 130;
  var wind = 0, lastY = window.pageYOffset, t0 = performance.now();

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function flake(initial) {
    var r = 1 + Math.random() * 3;
    return {
      x: Math.random() * w, y: initial ? Math.random() * h : -10,
      r: r, vy: 18 + r * 14 + Math.random() * 14,      // px/s, más grandes caen más rápido
      vx: 0, ux: 0, uy: 0,                             // impulso del soplido
      ph: Math.random() * 6.28, sw: 8 + Math.random() * 14, a: .5 + Math.random() * .5
    };
  }
  size();
  for (var i = 0; i < N; i++) flakes.push(flake(true));
  window.addEventListener("resize", size);

  window.addEventListener("scroll", function () {
    var y = window.pageYOffset, d = y - lastY; lastY = y;
    if (d < 0) {                                       // scroll hacia arriba: soplido suave
      var f = Math.min(-d, 50);
      flakes.forEach(function (p) {
        if (p.g === undefined) p.g = 0.4 + Math.random() * 1.4;      // cada copo reacciona distinto
        var disp = (Math.random() - .5) * f * 2.2 * p.g;             // dispersión lateral
        p.uy = Math.max(p.uy - f * (0.6 + Math.random() * 1.0) * p.g * (0.6 + p.r / 5), -115);
        p.ux = Math.max(-85, Math.min(85, p.ux + disp));
      });
    }
  }, { passive: true });

  function frame(now) {
    var dt = Math.min((now - t0) / 1000, 0.05); t0 = now;
    ctx.clearRect(0, 0, w, h);
    wind *= Math.pow(0.35, dt);
    for (var i = 0; i < flakes.length; i++) {
      var p = flakes[i];
      p.ph += dt * (0.8 + p.r * 0.2);
      // los impulsos se amortiguan y la gravedad retoma el control
      p.ux *= Math.pow(0.3, dt); p.uy *= Math.pow(0.4, dt);
      p.x += (Math.sin(p.ph) * p.sw + p.ux) * dt;
      p.y += (p.vy + p.uy) * dt;
      if (p.y > h + 10) { flakes[i] = flake(false); flakes[i].x = Math.random() * w; continue; }
      if (p.y < -30) { p.y = h + 5 * Math.random(); }
      if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = "rgba(255,255,255," + p.a.toFixed(2) + ")";
      ctx.shadowColor = "rgba(255,255,255,.9)"; ctx.shadowBlur = p.r * 2.5;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
