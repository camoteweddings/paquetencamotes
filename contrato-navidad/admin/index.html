<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Contratos | Camote Weddings</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../contrato.js"></script>
<style>
  :root { --night:#1B120C; --maroon:#7A2020; --gold:#C9A24B; --cream:#FAF8F3; --line:#E3DDCE; --ink:#4A4F4B; --muted:#6B7068; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans',system-ui,sans-serif; line-height:1.5; }
  header { background:var(--night); color:var(--cream); padding:18px 20px; font-family:'Playfair Display',Georgia,serif; font-weight:700; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-family:'Playfair Display',Georgia,serif; color:var(--night); font-size:24px; margin:0 0 16px; }
  fieldset { border:1px solid var(--line); background:#fff; border-radius:8px; padding:16px; margin:0 0 18px; }
  legend { font-weight:700; color:var(--maroon); padding:0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px) { .grid { grid-template-columns:1fr; } }
  label { display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600; color:var(--night); }
  input, select { font:inherit; font-size:16px; font-weight:400; min-height:46px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--cream); width:100%; }
  input.err { border-color:var(--maroon); background:#fdf1f1; }
  button { font:inherit; cursor:pointer; }
  .btn { background:var(--gold); color:var(--night); border:none; border-radius:6px; padding:13px 18px; font-weight:700; min-height:48px; }
  .btn.sec { background:#fff; border:1px solid var(--gold); }
  .btn.sm { padding:8px 12px; min-height:38px; font-size:13px; }
  .btn.danger { background:#fff; border:1px solid var(--maroon); color:var(--maroon); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .msg { margin-top:10px; font-size:14px; color:var(--maroon); }
  .ok { color:#2d6a3e; }
  .link { background:var(--cream); border-left:3px solid var(--gold); padding:10px 12px; border-radius:4px; word-break:break-all; font-size:14px; margin:10px 0; }
  .item { border:1px solid var(--line); background:#fff; border-radius:8px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; letter-spacing:.5px; }
  .b-ok { background:#dff3e4; color:#2d6a3e; } .b-pend { background:#fbefd0; color:#8a6a10; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>Camote Weddings — Contratos de Navidad</header>
<main>
  <div id="login">
    <h1>Acceso</h1>
    <fieldset><legend>Clave de administrador</legend>
      <label>Clave<input id="key" type="password" autocomplete="current-password"></label>
      <div class="row" style="margin-top:12px"><button class="btn" id="enter">Entrar</button></div>
      <div class="msg" id="lmsg"></div>
    </fieldset>
  </div>

  <div id="panel" hidden>
    <div class="row" style="justify-content:space-between;align-items:center"><h1>Nuevo contrato</h1><button class="btn sec sm" id="out">Salir</button></div>
    <form id="f" novalidate>
      <fieldset><legend>Datos del cliente</legend>
        <div class="grid">
          <label>Nombre completo<input id="nombre" required></label>
          <label>Carnet de identidad (CI)<input id="ci" required></label>
          <label>Teléfono / WhatsApp<input id="tel" inputmode="tel" required></label>
          <label>Correo electrónico<input id="email" type="email" required></label>
        </div>
      </fieldset>
      <fieldset><legend>Paquete y sesión</legend>
        <div class="grid">
          <label>Paquete<select id="paquete"></select></label>
          <label>Fecha de la sesión<input id="fecha" type="date" required></label>
          <label>Hora<input id="hora" type="time" required></label>
        </div>
      </fieldset>
      <button class="btn" type="submit">Generar contrato y enlace</button>
      <div class="msg" id="msg"></div>
    </form>
    <div id="res" hidden>
      <fieldset><legend>Enlace para el cliente</legend>
        <div class="link" id="url"></div>
        <div class="row"><button class="btn sm" id="copy">Copiar enlace</button><a class="btn sm sec" id="wa" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;color:var(--night)">Enviar por WhatsApp</a></div>
      </fieldset>
    </div>

    <h1 style="margin-top:30px">Contratos</h1>
    <div id="list"><div class="muted">Cargando…</div></div>
  </div>
</main>
<script>
(function () {
  var C = window.Contrato, $ = function (id) { return document.getElementById(id); };
  var BASE = location.origin + "/contrato-navidad/";
  var key = "";
  try { key = sessionStorage.getItem("ck") || ""; } catch (e) {}

  C.PAQUETES.forEach(function (p, i) { var o = document.createElement("option"); o.value = i; o.textContent = p.nombre + " — " + C.bs(p.precio); $("paquete").appendChild(o); });

  function entrar(k) {
    key = k;
    C.api("/admin/list", { key: key }).then(function (l) {
      try { sessionStorage.setItem("ck", key); } catch (e) {}
      $("login").hidden = true; $("panel").hidden = false; pintar(l);
    }).catch(function (e) {
      key = ""; try { sessionStorage.removeItem("ck"); } catch (x) {}
      $("login").hidden = false; $("panel").hidden = true;
      $("lmsg").textContent = e.status === 401 ? "Clave incorrecta." : "No se pudo conectar con el servicio.";
    });
  }
  function refrescar() { C.api("/admin/list", { key: key }).then(pintar); }

  function pintar(l) {
    if (!l.length) { $("list").innerHTML = '<div class="muted">Aún no hay contratos.</div>'; return; }
    $("list").innerHTML = l.map(function (c) {
      return '<div class="item" data-id="' + c.id + '"><div><strong>' + C.esc(c.nombre) + '</strong> ' +
        '<span class="badge ' + (c.firmado ? "b-ok" : "b-pend") + '">' + (c.firmado ? "FIRMADO" : "PENDIENTE") + '</span><br>' +
        '<span class="muted">' + C.esc(c.paquete || "") + " · " + C.fmtFecha(c.fecha || "") + '</span></div>' +
        '<div class="row"><button class="btn sm sec" data-a="copy">Copiar enlace</button>' +
        '<button class="btn sm" data-a="pdf"' + (c.firmado ? "" : " disabled title='Disponible cuando el cliente firme'") + '>Descargar PDF</button>' +
        '<button class="btn sm danger" data-a="del">Eliminar</button></div></div>';
    }).join("");
  }

  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var id = b.closest(".item").dataset.id, a = b.dataset.a;
    if (a === "copy") { navigator.clipboard.writeText(BASE + "?c=" + id); b.textContent = "¡Copiado!"; setTimeout(function () { b.textContent = "Copiar enlace"; }, 1500); }
    if (a === "pdf") {
      b.disabled = true; b.textContent = "Generando…";
      C.api("/admin/c/" + id, { key: key }).then(function (c) { if (!c.firma) throw new Error("sin firma"); return C.generarPDF(c); })
        .catch(function () { alert("No se pudo generar el PDF."); })
        .then(function () { b.disabled = false; b.textContent = "Descargar PDF"; });
    }
    if (a === "del" && confirm("¿Eliminar este contrato de forma permanente?")) {
      C.api("/admin/c/" + id, { key: key, method: "DELETE" }).then(refrescar);
    }
  });

  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = $("msg"); m.className = "msg"; m.textContent = "";
    var ids = ["nombre", "ci", "tel", "email", "fecha", "hora"], falta = false;
    ids.forEach(function (i) { var bad = !$(i).value.trim() || !$(i).checkValidity(); $(i).classList.toggle("err", bad); falta = falta || bad; });
    if (falta) { m.textContent = "Completa todos los campos obligatorios."; return; }
    var p = C.PAQUETES[$("paquete").value];
    var body = { nombre: $("nombre").value, ci: $("ci").value, tel: $("tel").value, email: $("email").value,
      paquete: p.nombre, precio: p.precio, incluye: p.incluye, fecha: $("fecha").value, hora: $("hora").value };
    m.textContent = "Generando…";
    C.api("/admin/create", { key: key, method: "POST", body: body }).then(function (r) {
      var url = BASE + "?c=" + r.id;
      $("url").textContent = url; $("res").hidden = false;
      $("wa").href = "https://wa.me/?text=" + encodeURIComponent("Hola " + body.nombre.split(" ")[0] + ", este es tu contrato de la sesión de Navidad. Revísalo y fírmalo aquí: " + url);
      $("copy").onclick = function () { navigator.clipboard.writeText(url); $("copy").textContent = "¡Copiado!"; setTimeout(function () { $("copy").textContent = "Copiar enlace"; }, 1500); };
      m.className = "msg ok"; m.textContent = "Contrato generado.";
      $("f").reset(); refrescar();
    }).catch(function () { m.textContent = "No se pudo generar el contrato."; });
  });

  $("enter").onclick = function () { entrar($("key").value); };
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") entrar($("key").value); });
  $("out").onclick = function () { try { sessionStorage.removeItem("ck"); } catch (e) {} location.reload(); };
  if (!C.configurado()) $("lmsg").textContent = "Servicio no configurado (falta la URL del Worker en contrato.js).";
  else if (key) entrar(key);
})();
</script>
</body>
</html>
